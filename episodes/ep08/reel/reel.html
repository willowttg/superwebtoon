<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EP.08 릴스 프레임</title>
<style>
  @font-face{font-family:'CornCorn';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2') format('woff2');font-display:block}
  @font-face{font-family:'KyoboHand';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/KyoboHand.woff') format('woff');font-display:block}
  :root{--ink:#3A3733;--point:#C77B3F;--gray:#6F685F}
  body{margin:0;background:#fff}
  #f{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:'KyoboHand',sans-serif;color:var(--ink)}
  #f img{position:absolute;left:0;width:1080px}
  .series{position:absolute;top:250px;left:0;right:0;text-align:center;font-size:48px;color:var(--gray)}
  .title{position:absolute;top:340px;left:0;right:0;text-align:center;font-family:'CornCorn',cursive;font-size:124px;line-height:1.16}
  .title b,.narr b,.cta{font-weight:400;color:var(--point)}
  .narr{position:absolute;top:270px;left:60px;right:60px;text-align:center;font-size:66px;line-height:1.38}
  .line{position:absolute;font-size:54px;line-height:1.3;color:var(--gray);white-space:pre;text-align:center}
  .cta{margin-top:28px;font-weight:700;-webkit-text-stroke:.8px var(--point)}
  .sub{position:absolute;left:60px;right:60px;text-align:center;font-size:56px;line-height:1.38;color:var(--gray)}
</style>
</head>
<body>
<div id="f"></div>
<script src="states.js"></script>
<script>
  const k = +(new URLSearchParams(location.search).get('s') || 0);
  const st = REEL.states[k], f = document.getElementById('f'), esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let h = `<img src="../img/${st.img}.png" style="top:${REEL.artTop}px">`;
  if (st.title) h += `<div class="series">- 작은 힘에도 작은 책임은 따른다 -</div><div class="title"><b>집에서만</b><br><b>충전</b>되는<br>초능력자 특징</div>`;
  if (st.sub) h += `<div class="sub" style="top:${REEL.subTop}px">${esc(st.sub)}</div>`;
  if (st.narr.length || st.cta) {
    h += '<div class="narr">' + st.narr.map((t, i) => {
      t = esc(t);
      return '<div>' + (i === 0 ? t.replace(/^([^,]+,)/, '<b>$1</b>') : t) + '</div>';
    }).join('') + (st.cta ? `<div class="cta">♥ ${esc(st.cta)} ♥</div>` : '') + '</div>';
  }
  for (const l of st.lines) h += `<div class="line" data-cx="${l.cx}" style="top:${l.y}px">${esc(l.text)}</div>`;
  f.innerHTML = h;
  document.fonts.ready.then(() => {
    // 특징 자막: 한 줄이 폭을 넘으면 그 줄만 줄인다
    f.querySelectorAll('.narr div').forEach(el => {
      el.style.whiteSpace = 'nowrap';
      let fs = 66;
      while (el.scrollWidth > el.clientWidth && fs > 40) el.style.fontSize = (--fs) + 'px';
    });
    // 대사 자막: compose 위치의 가운데에 두되 화면 안(좌우 40px)으로 민다
    f.querySelectorAll('.line').forEach(el => {
      const w = el.offsetWidth, cx = Math.min(Math.max(+el.dataset.cx, 40 + w / 2), 1040 - w / 2);
      el.style.left = (cx - w / 2) + 'px';
    });
  });
</script>
</body>
</html>
