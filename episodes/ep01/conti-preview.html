<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EP.01 타인의 감정을 꿰뚫는 초능력자들 — 콘티 프리뷰</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3A3733;
    --mute:#C9C3B9;
    --point:#C77B3F;
    --paper:#FFFDF9;
    --bg:#EFEAE2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:48px 32px 80px;
    background:var(--bg); color:var(--ink);
    font-family:'Gowun Dodum','Malgun Gothic',sans-serif;
  }
  header{max-width:1240px;margin:0 auto 40px}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
  header p{margin:0;font-size:14px;color:#8A837A;line-height:1.7}
  .swatches{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .sw{
    display:flex;align-items:center;gap:9px;
    border:1.5px solid #D9D2C7;background:#fff;color:var(--ink);
    border-radius:999px;padding:9px 16px 9px 10px;
    font:inherit;font-size:13px;cursor:pointer;
  }
  .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
  .sw i{width:18px;height:18px;border-radius:50%;display:block}
  .home{display:inline-block;margin-bottom:14px;font-size:13px;color:#8A837A;text-decoration:none}
  .grid{
    max-width:1240px;margin:0 auto;
    display:grid;gap:36px 28px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  figure{margin:0}
  .board{
    display:block;width:100%;height:auto;
    background:var(--paper);border-radius:10px;
    box-shadow:0 2px 18px rgba(58,55,51,.10);
  }
  figcaption{
    margin-top:10px;font-size:12px;line-height:1.6;color:#8A837A;
  }
  figcaption b{color:var(--ink);font-size:12px}

  /* --- SVG 공통 --- */
  .ln{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .fl{fill:var(--paper);stroke:var(--ink);stroke-width:9;stroke-linejoin:round}
  .dot{fill:var(--ink)}
  .muteln{fill:none;stroke:var(--mute);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .mutefl{fill:var(--paper);stroke:var(--mute);stroke-width:9}
  .mutedot{fill:var(--mute)}
  .ptln{fill:none;stroke:var(--point);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .ptfl{fill:var(--point)}
  .nar{font-family:'Gowun Dodum',sans-serif;font-size:52px;fill:var(--ink)}
  .nar-hero{font-family:'Gaegu','Gowun Dodum',sans-serif;font-size:76px;fill:var(--ink)}
  .small{font-family:'Gowun Dodum',sans-serif;font-size:32px;fill:#A69E93}
</style>
</head>
<body>

<header>
  <a class="home" href="../../index.html">← 프리뷰 목록</a>
  <h1>EP.01 타인의 감정을 꿰뚫는 초능력자들 — 레이아웃 프리뷰</h1>
  <p>4:5 (1080×1350) 캐러셀 7장 · 흰 배경 / 상단 나레이션 1~2줄 / 요소 최소<br>
  저채도 일상 → 3컷에서 포인트 컬러 등장(반전) → 5~6컷 따뜻한 톤. 그림은 배치·톤 확인용 러프.</p>
  <div class="swatches">
    <button class="sw" data-c="#C77B3F" aria-pressed="true"><i style="background:#C77B3F"></i>테라코타</button>
    <button class="sw" data-c="#E8503A" aria-pressed="false"><i style="background:#E8503A"></i>코랄 레드</button>
  </div>
</header>

<div class="grid">

<!-- ══════════ 표지 ══════════ -->
<figure>
<svg class="board" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">

  <text class="nar-hero" x="540" y="330" text-anchor="middle">사실 초능력자입니다</text>

  <!-- 바닥에 드리운 망토 그림자 -->

  <!-- 주인공: 평범하게 서 있음 -->
  <g transform="translate(540,1000)">
    <path class="ln" d="M-35,-140 L-35,-6 M35,-140 L35,-6"/>
    <path class="ln" d="M-62,-8 L-24,-8 M24,-8 L62,-8"/>
    <rect class="fl" x="-64" y="-302" width="128" height="168" rx="58"/>
    <path class="ln" d="M-62,-268 L-96,-172 M62,-268 L96,-172"/>
    <circle class="fl" cx="0" cy="-386" r="84"/>
    <path class="fl" d="M-84,-400 C-80,-486 80,-486 84,-400 C60,-452 -60,-452 -84,-400 Z"/>
    <circle class="dot" cx="-30" cy="-386" r="7"/>
    <circle class="dot" cx="30" cy="-386" r="7"/>
    <path class="ln" d="M-14,-348 Q0,-340 14,-348" stroke-width="7"/>
  </g>

  <text class="small" x="540" y="1310" text-anchor="middle">큰 힘에는 큰 책임이 따릅니다 · EP.01</text>
</svg>
<figcaption><b>표지</b> — 후킹 카피. 등 뒤 바닥에 망토 그림자만 살짝(정체 암시). 하단에 시리즈명 소자.</figcaption>
</figure>

<!-- ══════════ 1컷 ══════════ -->
<figure>
<svg class="board" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">

  <text class="nar" x="540" y="256" text-anchor="middle">모두의 기분이 읽힌다</text>

  <!-- 문틀 -->
  <path class="muteln" d="M150,1120 L150,470 L360,470 L360,1120" fill="none"/>
  <circle class="mutedot" cx="330" cy="810" r="12"/>

  <!-- 감정 아이콘: 먹구름 · 번개 · 먹구름 -->
  <g opacity=".85">

    <path class="mutefl" d="M900,610 a40,40 0 0 1 76,-18 a36,36 0 0 1 54,18 a27,27 0 0 1 -7,52 h-116 a27,27 0 0 1 -7,-52 Z"/>
  </g>

  <!-- 회의실 사람들 (저채도, 등 돌림) -->
  <g transform="translate(700,1080)">
    <rect class="mutefl" x="-56" y="-206" width="112" height="150" rx="52"/>

  </g>
  <g transform="translate(880,1090)">

  </g>

  <!-- 문 연 주인공 -->
  <g transform="translate(430,1120)">

  </g>
</svg>
<figcaption><b>1</b> — 일상 장면. 인물·배경 모두 저채도. 감정 아이콘(먹구름·번개)만 작게. 문틀로 "들어서는 순간" 표현.</figcaption>
</figure>

<!-- ══════════ 2컷 ══════════ -->
<figure>

  <text class="nar" x="540" y="256" text-anchor="middle">나는 왜 이렇게 피곤하게 살까</text>

  <!-- 책상 -->
  <rect class="muteln" x="200" y="900" width="680" height="18" rx="9" fill="var(--mute)"/>
  <path class="muteln" d="M280,918 L280,1120 M800,918 L800,1120"/>

</figure>

<!-- ══════════ 3컷 ══════════ -->
<figure>
<svg class="board" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">

  <text class="nar" x="540" y="256" text-anchor="middle">그건 타인의 감정을 읽는 초능력이라는 걸</text>

  <!-- 포인트 컬러 발광 -->
  <circle cx="540" cy="820" r="330" fill="var(--point)" opacity=".08"/>

  <g transform="translate(540,1060)">
    <!-- 망토: 어깨에서 걸리기 시작 -->
    <path d="M-70,-292 C-190,-210 -210,-90 -196,-4 L-70,-40 Z" fill="var(--point)" opacity=".9"/>
    <path d="M70,-292 C190,-210 210,-90 196,-4 L70,-40 Z" fill="var(--point)" opacity=".9"/>

    <path class="ln" d="M-35,-140 L-35,-6 M35,-140 L35,-6"/>

    <rect class="fl" x="-64" y="-302" width="128" height="168" rx="58"/>

<figcaption><b>3</b> — <span style="color:#C77B3F">반전 컷. 포인트 컬러 첫 등장</span>. 고개를 들고 망토가 어깨에 걸리기 시작. 시리즈 고정 시각 문법.</figcaption>
</figure>

<!-- ══════════ 4컷 ══════════ -->
<figure>
<svg class="board" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">

<!-- ══════════ 5컷 ══════════ -->
<figure>
<svg class="board" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <text class="nar" x="540" y="180" text-anchor="middle">당신 덕분에,</text>
  <text class="nar" x="540" y="256" text-anchor="middle">누군가는 혼자가 아니었다</text>

  <!-- 따뜻한 배경 톤 -->

<!-- ══════════ 6컷 ══════════ -->
<figure>
<svg class="board" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <text class="nar" x="540" y="180" text-anchor="middle">당신 곁의 감정 초능력자를</text>

<figcaption><b>6</b> — CTA. 독자 쪽을 향한 시선·웃는 눈. 하단에 다음 화 예고 한 줄로 팔로우 전환 유도.</figcaption>

</div>

<script>
  const btns = document.querySelectorAll('.sw');
  btns.forEach(b => b.addEventListener('click', () => {
    document.documentElement.style.setProperty('--point', b.dataset.c);
    btns.forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    document.querySelectorAll('figcaption span[style]').forEach(s => s.style.color = b.dataset.c);
  }));
</script>
</body>
</html>
