<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EP.01 컷 4·5 폰트 비교 12종</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Hi+Melody&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'ParkDaHyun';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Uiyeun';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105@1.1/Uiyeun.woff') format('woff');font-display:swap}
  @font-face{font-family:'KimKongHae';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/Ownglyph_kimkonghae.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'CornCorn';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Omyu';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/omyu_pretty.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'KyoboHand';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/KyoboHand.woff') format('woff');font-display:swap}
  @font-face{font-family:'Nadeuri';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimNadeuriTTF-L.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Nadeuri';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-5@1.0/HakgyoansimNadeuriTTF-B.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Ssukssuk';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.1/Cafe24Ssukssuk.woff') format('woff');font-display:swap}
  @font-face{font-family:'BMJua';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');font-display:swap}

  :root{--ink:#3A3733;--gray:#8A837A;--mind:#6B655D;--point:#C77B3F}
  *{box-sizing:border-box}
  body{margin:0;padding:32px 12px 96px;background:#EFEAE2;color:var(--ink);font-family:'Gowun Dodum','Malgun Gothic',sans-serif;line-height:1.6}
  main{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:13px;color:#8A837A;margin:0 0 22px}
  .sub a{color:var(--point)}
  .card{background:#FFFDF9;border-radius:12px;padding:12px 12px 14px;margin-bottom:18px;box-shadow:0 2px 14px rgba(58,55,51,.08)}
  .card h2{font-size:15px;margin:0 0 8px;font-weight:400}
  .card h2 small{font-size:12px;color:#8A837A;margin-left:8px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .box{position:relative;overflow:hidden;border-radius:8px;border:1px solid #E6E0D6}
  .slide{position:absolute;left:0;top:0;width:1080px;height:1350px;background:#fff;transform-origin:0 0}
  .slide img{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 100%;filter:saturate(.55) brightness(.99)}
  .nar{position:absolute;left:80px;right:80px;top:110px;margin:0;font-size:66px;line-height:1.42;word-break:keep-all}
  .mind{position:absolute;margin:0;font-size:50px;line-height:1.35;color:var(--mind);word-break:keep-all}
</style>
</head>
<body>
<main>
  <h1>EP.01 컷 4·5 폰트 비교</h1>
  <p class="sub">후보 12종을 같은 컷에 적용. 현재 완성본은 1번 나눔손글씨 펜. 후보 정리: <a href="https://github.com/willowttg/superwebtoon/blob/master/assets/fonts.md">fonts.md</a> · 완성본: <a href="preview.html">preview.html</a></p>
  <div id="cards"></div>
</main>
<script>
const FONTS = [
  ['나눔손글씨 펜', 'Nanum Pen Script', 'OFL · Google Fonts'],
  ['온글잎 박다현체', 'ParkDaHyun', '온글잎 · 상업 가능'],
  ['온글잎 의연체', 'Uiyeun', '온글잎 · 상업 가능'],
  ['온글잎 김콩해', 'KimKongHae', '온글잎 · 상업 가능'],
  ['온글잎 콘콘체', 'CornCorn', '온글잎 · 상업 가능'],
  ['오뮤 다예쁨체', 'Omyu', '무료 · 상업 가능'],
  ['교보손글씨 2019', 'KyoboHand', '교보문고 · 상업 가능'],
  ['개구쟁이 (Gaegu)', 'Gaegu', 'OFL · Google Fonts'],
  ['하이멜로디 (Hi Melody)', 'Hi Melody', 'OFL · Google Fonts'],
  ['학교안심 나들이', 'Nadeuri', 'OFL · KERIS'],
  ['카페24 쑥쑥', 'Ssukssuk', '카페24 · 상업 가능'],
  ['배달의민족 주아 (대조군)', 'BMJua', 'OFL'],
];
const CUT4 = `<img src="img/cut4.png" alt="">
  <p class="nar">단톡방에 "ㅇㅇ" 두 글자가 오면<br>거기 담긴 마음까지 읽는다.</p>
  <p class="mind" style="right:90px;top:330px;text-align:right">…화났나.<br>아까 그 말 때문인가.</p>
  <p class="mind" style="right:80px;bottom:60px;font-size:38px;color:#A69E93">(사실 아무것도 안 담겨 있음)</p>`;
const CUT5 = `<img src="img/cut5.png" alt="">
  <p class="nar">동생은 말한다. "그냥 물어보면 되잖아."<br>그게 되면 초능력자가 아니지.</p>`;
document.getElementById('cards').innerHTML = FONTS.map(([name, fam, lic], i) => `
<div class="card">
  <h2>${i+1}. ${name}<small>${fam} · ${lic}</small></h2>
  <div class="row">
    <div class="box"><div class="slide" style="font-family:'${fam}'">${CUT4}</div></div>
    <div class="box"><div class="slide" style="font-family:'${fam}'">${CUT5}</div></div>
  </div>
</div>`).join('');
function fit(){
  document.querySelectorAll('.box').forEach(b => {
    const s = b.clientWidth / 1080;
    b.style.height = Math.round(1350 * s) + 'px';
    b.firstElementChild.style.transform = `scale(${s})`;
  });
}
fit(); addEventListener('resize', fit);
</script>
</body>
</html>
